<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Template do motor de vídeo em slides (Calcula Prazo). Os marcadores de ícones e de cena são substituídos pelo render.mjs. -->
<style>

@font-face{font-family:'Plus Jakarta Sans';font-weight:500;src:url(assets/plus-jakarta-sans-latin-500-normal.woff2)}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;src:url(assets/plus-jakarta-sans-latin-600-normal.woff2)}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;src:url(assets/plus-jakarta-sans-latin-700-normal.woff2)}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;src:url(assets/plus-jakarta-sans-latin-800-normal.woff2)}
:root{--acc:#2563EB;--accd:#1D4ED8;--accl:#3B82F6;--bg:#F8FAFC;--brd:#E2E8F0;--txt:#0F172A;--txtm:#475569;--txts:#94A3B8;--err:#DC2626;--ok:#059669}
*{box-sizing:border-box;margin:0;padding:0}
html{--W:1920px;--H:1080px}html.v{--W:1080px;--H:1920px}
html,body{width:var(--W);height:var(--H);overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:#0A1630}
.slide{position:absolute;inset:0;overflow:hidden;color:var(--txt)}
.light{background:var(--bg)}
.dark{color:#fff;background:#091330}
.dark::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 760px at 86% -6%,#1E48B8 0%,transparent 62%),radial-gradient(800px 600px at -6% 108%,#12307A 0%,transparent 60%)}
.grid{position:absolute;inset:-96px;background:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px) 0 0/96px 96px,linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px) 0 0/96px 96px}
.dark .grid{background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/96px 96px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/96px 96px}
.orb{position:absolute;border-radius:50%;filter:blur(40px)}
.light .orb{background:radial-gradient(circle,rgba(59,130,246,.15),transparent 68%)}
.dark .orb{background:radial-gradient(circle,rgba(59,130,246,.4),transparent 68%)}
.z{position:relative;z-index:2}
/* header */
.hd{position:absolute;top:48px;left:96px;right:96px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.logo{display:flex;align-items:center;gap:18px;font-weight:800;font-size:42px;letter-spacing:-1px;color:var(--acc)}
.logo img{width:64px;height:64px;border-radius:16px;box-shadow:0 10px 24px rgba(37,99,235,.3)}
.logo b{font-weight:800;color:var(--txt)}
.dark .logo{color:#7FB0FF}.dark .logo b{color:#fff}
.tag{font-size:24px;font-weight:600;color:var(--txtm);padding:10px 26px;border:2px solid var(--brd);border-radius:999px;background:#fff}
.dark .tag{color:#C7D7F7;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
.ft{position:absolute;left:96px;bottom:44px;font-size:24px;font-weight:600;color:var(--txts);z-index:3}
/* progress */
#pb{position:absolute;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#3B82F6,#2563EB);z-index:50;box-shadow:0 0 18px rgba(59,130,246,.9)}
/* type */
.body{position:absolute;left:144px;right:144px;top:190px;bottom:130px;display:flex;align-items:center;gap:96px;z-index:2}
.txt{flex:1}
h1{font-weight:800;font-size:104px;line-height:1.08;letter-spacing:-3px}
.stmt{font-weight:700;font-size:72px;line-height:1.22;letter-spacing:-1.8px;max-width:1040px}
.w{display:inline-block}
mark{background:linear-gradient(transparent 58%,#BBD3FF 58%) no-repeat left center/0% 100%;color:inherit;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dark mark{background:linear-gradient(transparent 12%,rgba(59,130,246,.38) 12%,rgba(59,130,246,.38) 92%,transparent 92%) no-repeat left center/0% 100%;color:#CFE0FF;border-radius:10px;padding:0 16px;margin:0 -8px}
.sub{font-size:36px;line-height:1.5;color:var(--txtm);margin-top:34px;max-width:980px;font-weight:500}
.dark .sub{color:#C7D7F7}
.si{color:var(--acc);fill:none}
.dark .si{color:#9CC0FF}
.si.red{color:var(--err)}
/* cites */
.cites{display:flex;gap:20px;margin-top:48px;flex-wrap:wrap}
.cite{display:inline-flex;align-items:center;gap:14px;padding:14px 30px 14px 22px;border:2px solid rgba(37,99,235,.28);border-radius:999px;background:#fff;color:var(--accd);font-weight:700;font-size:32px;box-shadow:0 12px 30px rgba(37,99,235,.12)}
.cite svg{width:38px;height:38px;color:var(--acc)}
.dark .cite{background:rgba(255,255,255,.09);border-color:rgba(159,192,255,.4);color:#DCE8FF;box-shadow:none}
.dark .cite svg{color:#9CC0FF}
/* panel */
.panel{width:560px;height:560px;border-radius:72px;flex:none;display:grid;place-items:center;position:relative;background:#fff;border:2px solid var(--brd);box-shadow:0 40px 90px rgba(37,99,235,.16)}
.panel::before{content:"";position:absolute;inset:34px;border-radius:50px;border:2px dashed rgba(37,99,235,.22)}
.panel>svg{width:270px;height:270px}
.mv{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;width:100%}
.mv svg.h{width:140px;height:140px}
.mv svg.ar{width:90px;height:90px;color:var(--acc)}
.mv .ban{position:absolute;width:380px;height:380px;color:var(--err);left:50%;top:50%;margin:-190px 0 0 -190px}
/* question */
.wm{position:absolute;right:90px;top:50%;margin-top:-330px;width:660px;height:660px;color:#7FB0FF;z-index:1}.wm svg{opacity:.10}
.wm svg{width:100%;height:100%}
.q{position:absolute;left:200px;right:200px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:2}
.q h1{font-size:128px;letter-spacing:-4px;max-width:1300px}
.q .sm{font-size:34px;font-weight:700;color:#9CC0FF;margin-bottom:34px;display:flex;align-items:center;gap:18px}
.q .sm i{width:64px;height:5px;background:var(--accl);border-radius:5px;display:block}
/* cards */
.cards{display:flex;gap:56px;align-items:stretch;width:100%}
.card{flex:1;border-radius:48px;padding:60px;background:#fff;border:2px solid var(--brd);box-shadow:0 30px 70px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:30px;justify-content:center;position:relative;overflow:hidden}
.card .chip{width:128px;height:128px;border-radius:34px;background:#EAF1FF;display:grid;place-items:center}
.card .chip svg{width:80px;height:80px}
.card h3{font-size:56px;line-height:1.15;font-weight:800;letter-spacing:-1.8px}
.card p{font-size:36px;line-height:1.45;color:var(--txtm);font-weight:500}
.card.warn{background:#FFF8F8;border-color:rgba(220,38,38,.22)}
.card.warn .chip{background:#FEE2E2}
.card.ok{background:linear-gradient(160deg,#3B82F6,#1D4ED8);border:none;color:#fff;box-shadow:0 30px 70px rgba(37,99,235,.38)}
.card.ok p{color:#DCE8FF}
.card.ok .chip{background:rgba(255,255,255,.18)}
.card.ok .si{color:#fff}
.stamp{position:absolute;right:40px;top:40px;width:96px;height:96px}
.spark{width:420px;height:100px;margin-top:-6px}
.spark path{fill:none;stroke:var(--err);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.sep{align-self:center;flex:none;width:112px;height:112px;border-radius:50%;background:var(--txt);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}
.sep svg{width:60px;height:60px;color:#fff}
.col{display:flex;flex-direction:column;width:100%}
.ttl{font-size:76px;font-weight:800;letter-spacing:-2.5px;margin-bottom:36px}
/* rows */
.rows{display:flex;flex-direction:column;gap:28px;flex:1.25}
.row{white-space:nowrap;display:flex;align-items:center;gap:40px;background:#fff;border:2px solid rgba(220,38,38,.2);border-radius:40px;padding:34px 48px;box-shadow:0 24px 60px rgba(15,23,42,.07);font-size:50px;font-weight:700;letter-spacing:-1.2px}
.row .chip{width:96px;height:96px;border-radius:28px;background:#FEE2E2;display:grid;place-items:center;flex:none}
.row .chip svg{width:60px;height:60px}
/* quote */
.wrap{position:absolute;left:144px;right:144px;top:190px;bottom:130px;display:flex;align-items:center;justify-content:center;z-index:2}
.qt{position:relative;background:#fff;border-radius:64px;padding:96px 112px 96px 168px;border:2px solid var(--brd);box-shadow:0 44px 100px rgba(37,99,235,.16);max-width:1500px}
.qt::before{content:"";position:absolute;left:0;top:96px;bottom:96px;width:16px;border-radius:0 12px 12px 0;background:linear-gradient(180deg,#3B82F6,#1D4ED8)}
.qt .mk{position:absolute;left:64px;top:24px;font-size:230px;line-height:1;color:#BBD3FF;font-weight:800}
.qt .stmt{max-width:none;font-size:78px}
/* cta */
.cta{position:absolute;left:144px;right:144px;top:170px;bottom:120px;display:flex;align-items:center;gap:80px;z-index:2}
.cta .l{flex:1}
.cta h1{font-size:96px}
.cta .sub{font-size:42px;margin-top:24px}
.btn{margin-top:52px;display:inline-flex;align-items:center;gap:24px;background:linear-gradient(160deg,#3B82F6,#1D4ED8);padding:28px 56px;border-radius:999px;font-size:42px;font-weight:700;box-shadow:0 24px 60px rgba(37,99,235,.5)}
.btn svg{width:52px;height:52px;color:#fff}
.bw{width:860px;flex:none;border-radius:32px;background:#fff;color:var(--txt);box-shadow:0 50px 110px rgba(0,0,0,.5);overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:20px 26px;background:#EEF2F8;border-bottom:2px solid var(--brd)}
.bar i{width:16px;height:16px;border-radius:50%;background:#CBD5E1;display:block}
.url{flex:1;margin-left:14px;background:#fff;border-radius:999px;padding:9px 24px;font-size:20px;font-weight:600;color:var(--txtm);white-space:nowrap;overflow:hidden}
.pg{padding:36px 44px 40px}
.pg .bc{font-size:20px;color:var(--txts);font-weight:600}
.pg h2{font-size:42px;line-height:1.18;font-weight:800;letter-spacing:-1.2px;margin:14px 0 12px}
.pg .by{font-size:21px;color:var(--txtm);font-weight:600}
.pg .rs{margin-top:26px;border:2px solid var(--brd);border-left:8px solid var(--acc);border-radius:18px;padding:22px 28px;background:#F8FAFC}
.pg .rs b{font-size:24px;color:var(--accd);font-weight:800}
.pg .rs li{font-size:21px;line-height:1.45;color:var(--txtm);margin:10px 0 0 24px;font-weight:500}
.pg .go{margin-top:26px;display:inline-block;background:var(--acc);color:#fff;font-weight:700;font-size:22px;padding:14px 30px;border-radius:14px}

.row.okr{border-color:rgba(37,99,235,.22)}.row.okr .chip{background:#EAF1FF}

/* ===== formato vertical (Shorts 1080x1920) ===== */
html.v .hd{top:60px;left:64px;right:64px}
html.v .logo{font-size:38px;gap:14px}html.v .logo img{width:58px;height:58px;border-radius:15px}
html.v .tag{font-size:22px;padding:8px 20px}
html.v .ft{display:none}
html.v .body{left:72px;right:128px;top:200px;bottom:400px;flex-direction:column;justify-content:center;align-items:flex-start;gap:54px}
html.v .txt{flex:none;width:100%}
html.v h1{font-size:100px;letter-spacing:-3.5px}
html.v .stmt{font-size:66px;letter-spacing:-1.6px;max-width:none}
html.v .sub{font-size:38px;max-width:none;margin-top:28px}
html.v .panel{width:380px;height:380px;border-radius:60px;order:-1}
html.v .panel::before{inset:26px;border-radius:38px}
html.v .panel>svg{width:190px!important;height:190px!important}
html.v .mv svg.h{width:96px;height:96px}html.v .mv svg.ar{width:64px;height:64px}html.v .mv .ban{width:250px;height:250px;margin:-125px 0 0 -125px}
html.v .cites{margin-top:34px;gap:14px}
html.v .cite{font-size:28px;padding:11px 24px 11px 18px}html.v .cite svg{width:32px;height:32px}
html.v .q{left:72px;right:120px;top:200px;bottom:400px}
html.v .q h1{font-size:112px;letter-spacing:-4px;max-width:none}
html.v .q .sm{font-size:30px}
html.v .wm{right:-170px;width:640px;height:640px;margin-top:-320px}
html.v .cards{flex-direction:column;gap:26px}
html.v .card{padding:42px 46px;gap:20px;flex:none;border-radius:40px}
html.v .card .chip{width:96px;height:96px;border-radius:26px}html.v .card .chip svg{width:60px;height:60px}
html.v .card h3{font-size:46px}html.v .card p{font-size:30px}
html.v .stamp{width:76px;height:76px;right:30px;top:30px}
html.v .spark{width:100%;height:80px}
html.v .sep{width:84px;height:84px;font-size:28px}html.v .sep svg{width:44px;height:44px;transform:rotate(90deg)}
html.v .ttl{font-size:60px;margin-bottom:26px}
html.v .rows{flex:none;width:100%;gap:22px}
html.v .row{font-size:40px;padding:26px 32px;gap:26px;border-radius:32px;white-space:normal}
html.v .row .chip{width:80px;height:80px;border-radius:22px}html.v .row .chip svg{width:48px;height:48px}
html.v .wrap{left:72px;right:120px;top:200px;bottom:400px}
html.v .qt{padding:80px 52px 80px 96px;border-radius:48px;max-width:none}
html.v .qt::before{top:80px;bottom:80px;width:12px}
html.v .qt .stmt{font-size:56px}html.v .qt .mk{font-size:170px;left:30px;top:14px}
html.v .cover .cv{left:72px;right:110px;top:190px;bottom:360px;flex-direction:column;align-items:flex-start;justify-content:center;gap:42px}
html.v .cover .cl{flex:none;width:100%}
html.v .kick{font-size:28px;margin-bottom:26px}
html.v .cover h1{font-size:var(--tzv,112px);letter-spacing:-4px}
html.v .csub{font-size:38px;margin-top:28px;max-width:none}
html.v .cover .cite{font-size:26px}
html.v .cc{flex:none;width:100%;padding:34px 38px;gap:14px;border-radius:40px}
html.v .cct{font-size:30px}
html.v .cr{font-size:34px;padding:14px 18px;gap:20px;border-radius:22px}
html.v .cr .chip{width:68px;height:68px;border-radius:18px}html.v .cr .chip svg{width:42px;height:42px}
html.v .cta{left:72px;right:110px;top:190px;bottom:340px;flex-direction:column;gap:46px;align-items:flex-start;justify-content:center}
html.v .cta .l{flex:none;width:100%}
html.v .cta h1{font-size:88px}html.v .cta .sub{font-size:36px}
html.v .btn{font-size:34px;padding:22px 40px;margin-top:36px}html.v .btn svg{width:42px;height:42px}
html.v .bw{width:100%;border-radius:28px}
html.v .url{font-size:17px}
html.v .pg{padding:28px 34px 30px}html.v .pg h2{font-size:34px}html.v .pg .by{font-size:18px}html.v .pg .bc{font-size:17px}
html.v .pg .rs{margin-top:20px;padding:18px 22px}html.v .pg .rs li{font-size:18px}html.v .pg .rs li:nth-child(n+3){display:none}
html.v .pg .go{font-size:19px;padding:11px 24px;margin-top:20px}
/* capa / miniatura */
.cover .cv{position:absolute;left:120px;right:120px;top:170px;bottom:130px;display:flex;align-items:center;gap:64px;z-index:2}
.cover .cl{flex:1.45}
.kick{display:inline-block;font-size:34px;font-weight:700;color:#CFE0FF;background:rgba(59,130,246,.28);border:2px solid rgba(159,192,255,.45);padding:10px 30px;border-radius:999px;margin-bottom:34px}
.cover h1{font-size:var(--tz,150px);line-height:1.0;letter-spacing:-5.5px}
.slide.cover mark{background:linear-gradient(transparent 10%,#2563EB 10%,#2563EB 94%,transparent 94%) no-repeat left center/100% 100%;color:#fff;border-radius:18px;padding:0 24px;margin:0 -12px}
.csub{font-size:46px;font-weight:600;line-height:1.3;color:#DCE8FF;margin-top:38px;max-width:960px;letter-spacing:-.5px}
.cover .cites{margin-top:40px}
.cover .cite{font-size:30px;padding:12px 24px 12px 18px}.cover .cites{gap:14px}.cover .cr .si{color:var(--acc)}
.cc{flex:1;background:#fff;color:var(--txt);border-radius:48px;padding:46px 48px;box-shadow:0 40px 100px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:20px}
.cct{font-size:38px;font-weight:800;color:var(--accd);letter-spacing:-1px;margin-bottom:6px}

.cr .chip svg{width:52px;height:52px}

</style></head><body>
/*ICONS*/
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="x-arrow" viewBox="0 0 64 64"><path d="M10 32h40M34 16l16 16-16 16" stroke="currentColor" fill="none" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="x-ban" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" stroke="currentColor" fill="none" stroke-width="4.2"/><path d="M15 15 49 49" stroke="currentColor" fill="none" stroke-width="4.2" stroke-linecap="round"/></symbol>
<symbol id="x-x" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#DC2626"/><path d="M21 21 43 43M43 21 21 43" stroke="#fff" fill="none" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="x-ok" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff"/><path d="M19 33 28 42 45 23" stroke="#1D4ED8" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div id="deck"></div><div id="pb"></div>
<script>
window.CENA=/*CENA*/;
const C=window.CENA,M=C.marca,B=C.cortes,DUR=B[B.length-1];
const VERT=C.formato==='short';if(VERT)document.documentElement.classList.add('v');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
const refIc=r=>/jurisp|s[úu]mula|tst|stf|stj|tribunal|orienta/i.test(r)?'ic-jurisprudencia':'ic-legislacao';
const U=(id,c='si',s='')=>`<svg class="${c}" ${s}><use href="#${id}"/></svg>`;
const HD=`<div class="hd"><div class="logo"><img src="assets/logo.png"><span>${esc(M.nome1)} <b>${esc(M.nome2)}</b></span></div><div class="tag">${esc(M.tag)}</div></div>`;
const BG=i=>`<div class="grid"></div><div class="orb" data-ph="${i}" style="width:760px;height:760px;right:-120px;top:-160px"></div><div class="orb" data-ph="${i+2}" style="width:620px;height:620px;left:-160px;bottom:-200px"></div>`;
const FT=`<div class="ft">${esc(M.site)}</div>`;
const cites=(arr,d)=>arr&&arr.length?`<div class="cites">${arr.map((r,k)=>`<div class="cite" data-a="up:${(d+k*.25).toFixed(2)}:.6">${U(refIc(r))}${esc(r)}</div>`).join('')}</div>`:'';
const panel=ic=>`<div class="panel" data-a="pop:.25:.8"><svg class="si" data-f="10:1" style="width:270px;height:270px"><use href="#${ic}"/></svg></div>`;
const PAINEL={transferencia:()=>`<div class="panel" data-a="pop:.25:.8"><div class="mv">${U('ic-inicio','si h','data-a="left:.7:.6"')}<svg class="si ar"><use href="#x-arrow"/></svg>${U('ic-inicio','si h','data-a="right:1.0:.6"')}${U('x-ban','si ban','data-a="pop:1.7:.6"')}</div></div>`};
const card=(c,side,d)=>{const cls=c.estilo==='aviso'?'warn':c.estilo==='ok'?'ok':'';
 const spark=c.grafico==='queda'?`<svg class="spark" viewBox="0 0 420 100"><path pathLength="1" style="stroke-dasharray:1" data-a="draw:1.2:1.2" d="M6 12 L110 30 L190 20 L300 62 L412 86"/></svg>`:'';
 const stamp=c.selo?`<svg class="stamp" data-a="pop:1.2:.5"><use href="#${c.selo==='x'?'x-x':'x-ok'}"/></svg>`:'';
 return `<div class="card ${cls}" data-a="${side}:${d}:.8"><div class="chip">${U(c.icone,c.estilo==='aviso'?'si red':'si')}</div><h3>${md(c.titulo)}</h3>${c.texto?`<p>${md(c.texto)}</p>`:''}${spark}${stamp}</div>`;};
// Tamanho do título da capa conforme o comprimento (evita estourar a miniatura)
const tzCapa=t=>{const n=String(t).replace(/\*\*/g,'').length;return n>34?[104,84]:n>26?[116,92]:n>20?[134,102]:[150,112];};
const L={
capa:(c,i)=>`<section class="slide dark cover">${BG(i)}${HD}<div class="cv"><div class="cl">${c.kicker?`<div class="kick">${esc(c.kicker)}</div>`:''}<h1 style="--tz:${tzCapa(c.titulo)[0]}px;--tzv:${tzCapa(c.titulo)[1]}px">${md(c.titulo)}</h1>${c.sub?`<div class="csub">${md(c.sub)}</div>`:''}${cites(c.refs,0).replace(/ data-a="[^"]*"/g,'')}</div>${c.pontos?`<div class="cc"><div class="cct">${esc(c.pontos_titulo||'')}</div>${c.pontos.map(p=>`<div class="cr"><div class="chip">${U(p.icone,'si')}</div>${esc(p.texto)}</div>`).join('')}</div>`:''}</div>${FT}</section>`,
pergunta:(c,i)=>`<section class="slide dark">${BG(i)}${HD}<div class="wm" data-a="fade:.1:1.2" data-f="14:${i}">${U(c.marca_dagua||'ic-faq','si','style="color:#7FB0FF"')}</div><div class="q">${c.kicker?`<div class="sm" data-a="up:.1:.6"><i></i>${esc(c.kicker)}</div>`:''}<h1 data-words>${md(c.titulo)}</h1>${cites(c.refs,1.6)}</div>${FT}</section>`,
afirmacao:(c,i)=>`<section class="slide light">${BG(i)}${HD}<div class="body"><div class="txt"><div class="stmt" data-words>${md(c.texto)}</div>${cites(c.refs,1.9)}</div>${c.painel&&PAINEL[c.painel]?PAINEL[c.painel]():panel(c.icone||'ic-legislacao')}</div>${FT}</section>`,
comparacao:(c,i)=>`<section class="slide light">${BG(i)}${HD}<div class="body"><div class="col">${c.titulo?`<div class="ttl" data-a="up:.1:.6">${md(c.titulo)}</div>`:''}<div class="cards">${card(c.esq,'left',.2)}${c.centro==='seta'?`<div class="sep" data-a="pop:.8:.5">${U('x-arrow','si')}</div>`:c.centro==='vs'?`<div class="sep" data-a="pop:.8:.5">vs</div>`:''}${card(c.dir,'right',.2)}</div>${cites(c.refs,2.4)}</div></div>${FT}</section>`,
destaque:(c,i)=>`<section class="slide light">${BG(i)}${HD}<div class="body"><div class="txt"><h1 data-words>${md(c.titulo)}</h1>${c.sub?`<div class="sub" data-a="up:1.1:.7">${md(c.sub)}</div>`:''}${cites(c.refs,2.0)}</div>${panel(c.icone||'ic-legislacao')}</div>${FT}</section>`,
lista:(c,i)=>`<section class="slide light">${BG(i)}${HD}<div class="body"><div class="txt" style="flex:.9"><h1 data-words>${md(c.titulo)}</h1></div><div class="rows">${c.itens.map((it,k)=>`<div class="row ${c.estilo==='ok'?'okr':''}" data-a="right:${(.5+k*.4).toFixed(2)}:.7"><div class="chip">${U(it.icone,c.estilo==='ok'?'si':'si red')}</div>${esc(it.texto)}</div>`).join('')}</div></div>${FT}</section>`,
citacao:(c,i)=>`<section class="slide light">${BG(i)}${HD}<div class="wrap"><div class="qt" data-a="pop:.1:.7"><div class="mk" data-a="pop:.5:.6">“</div><div class="stmt" data-words data-base=".6">${md(c.texto)}</div></div></div>${FT}</section>`,
encerramento:(c,i)=>{const a=c.artigo||{};return `<section class="slide dark">${BG(i)}${HD}<div class="cta"><div class="l"><h1 data-words>${md(c.titulo)}</h1><div class="sub" data-a="up:1.0:.6">${md(c.sub||'')}</div><div class="btn" data-a="pop:1.5:.6" data-pulse="1">${U('ic-artigos','si')}${esc(c.botao||M.site)}</div></div>
<div class="bw" data-a="up:.4:.9"><div class="bar"><i></i><i></i><i></i><div class="url">${esc(a.url_exibida||'')}</div></div><div class="pg"><div class="bc">${esc(a.categoria||'')}</div><h2>${esc(a.titulo||'')}</h2><div class="by">${esc(a.autor||'')} · ${esc(a.data||'')}</div>${(a.resumo||[]).length?`<div class="rs"><b>Resumo rápido</b><ul>${a.resumo.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="go">⚡ Acessar Calculadoras →</div></div></div></div>${FT}</section>`;}
};
document.getElementById('deck').innerHTML=C.cenas.map((c,i)=>{if(!L[c.tipo])throw new Error('tipo de cena desconhecido: '+c.tipo+' (cena '+(i+1)+')');return L[c.tipo](c,i+1);}).join('');
const slides=[...document.querySelectorAll('.slide')];
function splitWords(el,base,step){let idx=0;const walk=n=>{[...n.childNodes].forEach(ch=>{if(ch.nodeType===3){const f=document.createDocumentFragment();ch.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));}else{const s=document.createElement('span');s.className='w';s.textContent=p;s.dataset.a=`up:${(base+idx*step).toFixed(3)}:.55`;idx++;f.appendChild(s);}});ch.replaceWith(f);}else if(ch.nodeType===1){if(ch.tagName==='MARK'){const st=idx;walk(ch);ch.dataset.a=`wipe:${(base+st*step+.3).toFixed(3)}:.7`;}else walk(ch);}});};walk(el);}
slides.forEach(s=>s.querySelectorAll('[data-words]').forEach(el=>splitWords(el,parseFloat(el.dataset.base||.3),.075)));
const AN=slides.map(s=>[...s.querySelectorAll('[data-a]')].map(e=>{const [ty,d,du]=e.dataset.a.split(':');return{e,ty,d:+d,du:+(du||.7),f:e.dataset.f?e.dataset.f.split(':').map(Number):null,pulse:e.dataset.pulse}}));
const FL=slides.map(s=>[...s.querySelectorAll('[data-f]:not([data-a])')].map(e=>({e,f:e.dataset.f.split(':').map(Number)})));
const ORB=slides.map(s=>[...s.querySelectorAll('.orb')]);
const GR=slides.map(s=>s.querySelector('.grid'));
const cl=x=>Math.max(0,Math.min(1,x));
const eo=p=>1-Math.pow(1-p,3);
const eb=p=>1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2);
window.render=function(t){
 document.getElementById('pb').style.width=(t/DUR*(VERT?1080:1920))+'px';
 slides.forEach((s,i)=>{
  const st=i==0?0:B[i]-.15,en=i==slides.length-1?1e9:B[i+1]+.2;
  if(t<st||t>en){s.style.display='none';return;}
  s.style.display='block';s.style.zIndex=i+1;
  s.style.opacity=i==0?1:cl((t-st)/.3);
  const lt=i==0?t:t-B[i];
  ORB[i].forEach(o=>{const ph=+o.dataset.ph;o.style.transform=`translate(${Math.sin(t*.35+ph)*70}px,${Math.cos(t*.27+ph)*50}px)`;});
  GR[i].style.transform=`translate(${(t*6)%96}px,${(t*4)%96}px)`;
  AN[i].forEach(a=>{
   const p=cl((lt-a.d)/a.du),e=a.e;let tr='',op=1;
   const f=a.f?` translateY(${Math.sin(t*1.4+a.f[1])*a.f[0]}px)`:'';
   switch(a.ty){
    case'up':op=eo(p);tr=`translateY(${(1-eo(p))*34}px)`;break;
    case'left':op=eo(p);tr=`translateX(${-(1-eo(p))*110}px)`;break;
    case'right':op=eo(p);tr=`translateX(${(1-eo(p))*110}px)`;break;
    case'pop':op=cl(p*3);tr=`scale(${.55+.45*eb(p)})`;break;
    case'fade':op=eo(p);break;
    case'draw':e.style.strokeDashoffset=1-eo(p);op=1;break;
    case'wipe':e.style.backgroundSize=`${eo(p)*100}% 100%`;op=1;break;
   }
   if(a.pulse&&p>=1)tr=`scale(${1+.035*Math.sin((lt-a.d)*3.2)})`;
   e.style.opacity=op;
   if(a.ty!=='draw'&&a.ty!=='wipe')e.style.transform=tr+f;
  });
  FL[i].forEach(o=>{o.e.style.transform=`translateY(${Math.sin(t*1.4+o.f[1])*o.f[0]}px)`;});
 });
};
render(0);
</script></body></html>
