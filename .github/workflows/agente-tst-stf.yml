name: Agente TST e STF
on:
  schedule:
    - cron: '30 12 * * 1-5'  # 09h30 Brasília, dias úteis
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-slugify
      - name: Executar agente TST/STF
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/agentes/agente_tst_stf.py
      - name: Publicar
        run: |
          git config user.name "Agente TST-STF"
          git config user.email "bot@calculaprazo.com.br"
          git add -A
          git diff --staged --quiet || git commit -m "TST/STF: $(date '+%d/%m/%Y %H:%M')"
          git push
