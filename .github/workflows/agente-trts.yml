name: Agente TRT

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 08h da manhã em Brasília, dias úteis
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Executar Agente TRT
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/agentes/agente_trt.py

      - name: Publicar no GitHub
        run: |
          git config user.name "Agente TRT"
          git config user.email "bot@calculaprazo.com.br"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "TRT: $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
