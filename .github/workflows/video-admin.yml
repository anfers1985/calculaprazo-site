name: Vídeo do admin (slides + Short ilustrado)

# Pipeline SEPARADO do "Video Pipeline" (Shorts automáticos em Remotion).
# É disparado pelo painel admin (função videos-gerar) com o id do job; processa só esse job.
# Quando o admin usa "Gerar o par do dia", vem também job_id_2: o 2º job roda logo depois do 1º, na mesma execução.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID do job em video_admin_jobs'
        required: true
        type: string
      job_id_2:
        description: '(opcional) 2º job, processado depois do primeiro'
        required: false
        default: ''
        type: string

concurrency:
  group: video-admin
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ── Tempos de espera GENEROSOS (o Google pode levar minutos sob demanda alta; abortar cedo só gasta a cota) ──
  IA_TIMEOUT_MS: '150000'      # texto (Gemini/OpenRouter/NVIDIA): 2,5 min por chamada
  IA_MAX_TOKENS: '16384'       # roteiros longos não podem ser cortados no meio do JSON
  IA_ORCAMENTO_MIN: '6'         # teto de tempo por chamada de texto (todos os provedores somados); passou disso, o job falha e você clica em "Tentar de novo"
  IA_RODADAS: '2'              # se todos os provedores de texto falharem, espera 1 min e repete a cadeia (até 3 rodadas)
  IMG_TIMEOUT_MS: '480000'     # imagem: 8 min por tentativa
  IMG_TENTATIVAS: '5'          # tentativas por provedor, com espera crescente entre elas
  IMG_INTERVALO_MS: '8000'     # pausa entre imagens (plano gratuito ≈ 10 pedidos/min)
  IMG_ORDEM: 'cloudflare,gemini' # no GitHub não há 9router; Cloudflare (gratuito) primeiro, Google como reserva
  # ── Voz Gemini 3.8 TTS (opcional): defina em Settings → Secrets and variables → Actions → aba "Variables". Vazio = padrão do código.
  GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}       # gemini-3.8-flash-tts (padrão) ou gemini-3.8-flash-lite-tts
  GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}       # Kore (padrão), Puck... ou o ID voice_... de uma voz sua criada no AI Studio
  GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}       # vazio = "narração clara, calma e profissional, em português do Brasil"
  GEMINI_TTS_RESERVA: ${{ vars.GEMINI_TTS_RESERVA }}   # "francisca" = se o Google falhar, refaz o vídeo INTEIRO com a Francisca (em vez de parar)
  # GEMINI_IMAGE_MODELS: 'gemini-2.5-flash-image,gemini-3.1-flash-image-preview'   # (padrão do código; descomente para trocar)

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # teto do job (o máximo do GitHub é 360)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema (ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências Node
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências Python (narração)
        run: pip install edge-tts pydub supabase requests num2words

      # Um passo só: processar.mjs aceita "id1,id2" e roda um depois do outro (cada um com a sua pasta de trabalho);
      # se o 1º falhar o 2º roda mesmo assim, e o que falhou fica com "Tentar de novo" no admin.
      - name: Gerar o(s) vídeo(s)
        timeout-minutes: 280
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}        # opcional
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # imagens GRÁTIS (Workers AI, FLUX.1 schnell)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}        # opcional
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}            # opcional
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}                # opcional
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IDS: ${{ inputs.job_id }}${{ inputs.job_id_2 != '' && format(',{0}', inputs.job_id_2) || '' }}
        run: node scripts/video-admin/processar.mjs "$IDS"

      # Cancelou a execução (ou ela caiu)? Os jobs não ficam presos "em andamento" ocupando as vagas: viram "erro" com "Tentar de novo".
      - name: Liberar jobs interrompidos
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IDS: ${{ inputs.job_id }}${{ inputs.job_id_2 != '' && format(',{0}', inputs.job_id_2) || '' }}
        run: node scripts/video-admin/liberar-travados.mjs "$IDS"

      - name: Limpar arquivos antigos do Storage (admin-videos/)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/video-admin/limpar.mjs
