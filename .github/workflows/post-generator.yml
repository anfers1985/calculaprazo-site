name: Gerador Fallback de Posts

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 11h da manhã em Brasília (depois dos agentes especializados)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Executar Gerador Fallback
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/gerar_posts.py

      - name: Publicar no GitHub
        run: |
          git config user.name "Gerador Fallback"
          git config user.email "bot@calculaprazo.com.br"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "Fallback: Posts Gerados Manualmente $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
