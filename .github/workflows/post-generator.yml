name: Gerador Fallback de Posts

on:
  workflow_dispatch:   # Apenas execução manual (não mais automática)

jobs:
  gerar-rascunho:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Executar Gerador Fallback
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/gerar_posts.py

      - name: Commit para branch de rascunho
        run: |
          git config user.name "Gerador Fallback"
          git config user.email "bot@calculaprazo.com.br"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git checkout -B "draft/agentes"
            git commit -m "[RASCUNHO] Fallback: $(date '+%d/%m/%Y %H:%M') — aguardando revisão"
            git push origin "draft/agentes" --force
            echo "Rascunho publicado em draft/agentes. Abra um PR para main após revisão."
          fi
