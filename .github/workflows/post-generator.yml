name: Gerar Posts Diarios

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 6h da manhã em Brasília (ajuste se quiser)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Executar Gerador de Posts (se você tiver um script principal)
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/gerar_posts.py   # ← mude se o nome do arquivo for diferente

      - name: Publicar no GitHub
        run: |
          git config user.name "Gerador de Posts"
          git config user.email "bot@calculaprazo.com.br"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "Posts Diários: $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
