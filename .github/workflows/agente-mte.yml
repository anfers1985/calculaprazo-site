name: Agente mte
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests python-slugify
      - name: Rodar agente
        run: python scripts/agentes/agente_mte.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - name: Commit e push
        run: |
          git config user.name "CalculaPrazo Bot"
          git config user.email "bot@calculaprazo.com.br"
          git add blog/ data/posts.json sitemap.xml
          git diff --staged --quiet || git commit -m "conteudo: agente-mte $(date +%d/%m/%Y)"
          git push
