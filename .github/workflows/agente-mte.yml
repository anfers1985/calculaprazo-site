name: Agente MTE

on:
  schedule:
    - cron: '0 15 * * 1-5'   # Horário Brasília (UTC-3)
  workflow_dispatch:   # Permite execução manual

jobs:
  gerar-rascunho:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Executar agente — gerar rascunho
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/agentes/agente_mte.py

      - name: Verificar se há conteúdo novo
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhum conteúdo novo gerado."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Conteúdo novo detectado."
          fi

      - name: Commit e push para branch de rascunho
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Agente MTE"
          git config user.email "bot@calculaprazo.com.br"

          # Cria/atualiza a branch draft/agentes
          BRANCH="draft/agentes"
          git checkout -B "$BRANCH"

          git add -A
          git commit -m "[RASCUNHO] MTE: $(date '+%d/%m/%Y %H:%M') — aguardando revisão"
          git push origin "$BRANCH" --force

          echo ""
          echo "=============================================="
          echo "  RASCUNHO PUBLICADO — REVISÃO NECESSÁRIA"
          echo "  Branch: $BRANCH"
          echo "  Ação: abra um Pull Request no GitHub"
          echo "        de 'draft/agentes' para 'main'"
          echo "        REVISE o conteúdo antes de mergear"
          echo "=============================================="
