name: Limpar Storage (jobs travados)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'   # todo dia, 04h Brasília — precisa rodar diariamente pra aplicar a retenção de 5 dias dos vídeos publicados (ver RETENCAO_DIAS em scripts/10-limpar-jobs-travados.mjs)

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install @supabase/supabase-js
      - run: node scripts/10-limpar-jobs-travados.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
