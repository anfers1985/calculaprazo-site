name: Agente Único — Publicação Diária

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 06h Brasília (UTC-3) dias úteis
    - cron: '0 14 * * 1-5'  # 11h Brasília — segunda execução do dia
  workflow_dispatch:          # Permite rodar manualmente pelo botão no GitHub

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify urllib3

      - name: Verificar secrets configuradas
        run: |
          echo "=== VERIFICAÇÃO DE SECRETS ==="
          ALGUMA_LLM=""

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✅ GEMINI_API_KEY: presente (${#GEMINI_API_KEY} chars) [PRIMÁRIO]"
            ALGUMA_LLM=1
          else
            echo "-- GEMINI_API_KEY: não configurada"
          fi

          if [ -n "$GLM_API_KEY" ]; then
            echo "✅ GLM_API_KEY: presente (${#GLM_API_KEY} chars) [SECUNDÁRIO]"
            ALGUMA_LLM=1
          else
            echo "-- GLM_API_KEY: não configurada"
          fi

          if [ -n "$QWEN_API_KEY" ]; then
            echo "✅ QWEN_API_KEY: presente (${#QWEN_API_KEY} chars) [TERCIÁRIO]"
            ALGUMA_LLM=1
          else
            echo "-- QWEN_API_KEY: não configurada"
          fi

          if [ -n "$GROK_API_KEY" ]; then
            echo "✅ GROK_API_KEY: presente (${#GROK_API_KEY} chars) [QUATERNÁRIO]"
            ALGUMA_LLM=1
          else
            echo "-- GROK_API_KEY: não configurada"
          fi

          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "✅ OPENROUTER_API_KEY: presente (${#OPENROUTER_API_KEY} chars) [FALLBACK]"
            ALGUMA_LLM=1
          else
            echo "-- OPENROUTER_API_KEY: não configurada"
          fi

          if [ -n "$UNSPLASH_ACCESS_KEY" ]; then
            echo "✅ UNSPLASH_ACCESS_KEY: presente"
          else
            echo "⚠️  UNSPLASH_ACCESS_KEY: não configurada — imagem fallback será usada"
          fi

          if [ -z "$ALGUMA_LLM" ]; then
            echo "❌ ERRO CRÍTICO: nenhuma API de LLM configurada"
            exit 1
          fi
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY:         ${{ secrets.GLM_API_KEY }}
          QWEN_API_KEY:        ${{ secrets.QWEN_API_KEY }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Rodar agente
        run: python scripts/gerar_posts.py
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY:         ${{ secrets.GLM_API_KEY }}
          QWEN_API_KEY:        ${{ secrets.QWEN_API_KEY }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PYTHONPATH: scripts/agentes

      - name: Commit e push
        run: |
          git config user.name "CalculaPrazo Bot"
          git config user.email "bot@calculaprazo.com.br"
          git add blog/ data/posts.json sitemap.xml
          git diff --staged --quiet || git commit -m "conteudo: agente-unico $(date +%d/%m/%Y-%H:%M)"
          git push
