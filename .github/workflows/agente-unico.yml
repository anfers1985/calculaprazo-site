name: Agente Único — Publicação Diária

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 06h Brasília (UTC-3) dias úteis
    - cron: '0 14 * * 1-5'  # 11h Brasília — segunda execução do dia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify urllib3

      - name: Verificar secrets
        run: |
          echo "=== SECRETS ==="
          ALGUMA=""
          [ -n "$GEMINI_API_KEY" ]     && echo "✅ GEMINI_API_KEY (${#GEMINI_API_KEY} chars) [1º]"   && ALGUMA=1 || echo "-- GEMINI_API_KEY ausente"
          [ -n "$GLM_API_KEY" ]        && echo "✅ GLM_API_KEY (${#GLM_API_KEY} chars) [2º]"         && ALGUMA=1 || echo "-- GLM_API_KEY ausente"
          [ -n "$GROK_API_KEY" ]       && echo "✅ GROK_API_KEY (${#GROK_API_KEY} chars) [3º]"       && ALGUMA=1 || echo "-- GROK_API_KEY ausente"
          [ -n "$OPENROUTER_API_KEY" ] && echo "✅ OPENROUTER_API_KEY (${#OPENROUTER_API_KEY} chars) [4º]" && ALGUMA=1 || echo "-- OPENROUTER_API_KEY ausente"
          [ -n "$UNSPLASH_ACCESS_KEY" ] && echo "✅ UNSPLASH_ACCESS_KEY" || echo "⚠️  UNSPLASH_ACCESS_KEY ausente (imagem fallback)"
          [ -z "$ALGUMA" ] && echo "❌ ERRO: nenhuma API de LLM configurada" && exit 1 || true
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY:         ${{ secrets.GLM_API_KEY }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Rodar agente
        run: python scripts/gerar_posts.py
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY:         ${{ secrets.GLM_API_KEY }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PYTHONPATH: scripts/agentes

      - name: Commit e push
        run: |
          git config user.name "CalculaPrazo Bot"
          git config user.email "bot@calculaprazo.com.br"
          git add blog/ data/posts.json sitemap.xml
          git diff --staged --quiet || git commit -m "conteudo: agente-unico $(date +%d/%m/%Y-%H:%M)"
          git push
