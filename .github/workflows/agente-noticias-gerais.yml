name: Agente agente-noticias-gerais

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-slugify

      - name: Rodar agente
        run: python scripts/agentes/agente_noticias_gerais.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PYTHONPATH: scripts/agentes

      - name: Commit e push
        run: |
          git config user.name "CalculaPrazo Bot"
          git config user.email "bot@calculaprazo.com.br"
          git add blog/ data/posts.json sitemap.xml
          git diff --staged --quiet || git commit -m "conteudo: agente-noticias-gerais $(date +%d/%m/%Y)"
          git push
