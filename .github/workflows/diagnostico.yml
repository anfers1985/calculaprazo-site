name: Diagnóstico — testar secrets e fontes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests urllib3

      - name: Verificar secrets
        run: |
          echo "=== SECRETS ==="
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY: não configurada"
          else
            echo "✅ GEMINI_API_KEY: presente (${#GEMINI_API_KEY} chars)"
          fi
          if [ -z "$GROK_API_KEY" ]; then
            echo "⚠️  GROK_API_KEY: não configurada"
          else
            echo "✅ GROK_API_KEY: presente (${#GROK_API_KEY} chars)"
          fi
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "⚠️  OPENROUTER_API_KEY: não configurada"
          else
            echo "✅ OPENROUTER_API_KEY: presente (${#OPENROUTER_API_KEY} chars)"
          fi
          if [ -z "$UNSPLASH_ACCESS_KEY" ]; then
            echo "⚠️  UNSPLASH_ACCESS_KEY: não configurada"
          else
            echo "✅ UNSPLASH_ACCESS_KEY: presente"
          fi
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Testar Gemini API
        run: |
          python3 -c "
          import os, requests
          key = os.environ.get('GEMINI_API_KEY','')
          if not key:
              print('-- GEMINI_API_KEY ausente, pulando teste')
              exit(0)
          print('Testando Gemini 1.5 Flash...')
          url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key
          r = requests.post(url, json={'contents':[{'parts':[{'text':'Responda apenas: OK'}]}],'generationConfig':{'maxOutputTokens':10}}, timeout=30)
          print('HTTP:', r.status_code)
          if r.status_code == 200:
              txt = r.json().get('candidates',[{}])[0].get('content',{}).get('parts',[{}])[0].get('text','')
              print('✅ Gemini OK — resposta:', txt.strip())
          elif r.status_code == 429:
              print('⚠️  Gemini 429 (rate limit) — tente em alguns minutos')
          else:
              print('❌ Gemini erro:', r.text[:300])
          "
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Testar Grok API
        run: |
          python3 -c "
          import os, requests
          key = os.environ.get('GROK_API_KEY','')
          if not key:
              print('-- GROK_API_KEY ausente, pulando teste')
              exit(0)
          print('Testando Grok 3 Mini...')
          r = requests.post(
              'https://api.x.ai/v1/chat/completions',
              headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},
              json={'model':'grok-3-mini','messages':[{'role':'user','content':'Responda apenas: OK'}],'max_tokens':10},
              timeout=30
          )
          print('HTTP:', r.status_code)
          if r.status_code == 200:
              txt = r.json()['choices'][0]['message']['content']
              print('✅ Grok OK — resposta:', txt.strip())
          elif r.status_code == 429:
              print('⚠️  Grok 429 (rate limit)')
          else:
              print('❌ Grok erro:', r.text[:300])
          "
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}

      - name: Testar OpenRouter free
        run: |
          python3 -c "
          import os, requests
          key = os.environ.get('OPENROUTER_API_KEY','')
          if not key:
              print('-- OPENROUTER_API_KEY ausente, pulando teste')
              exit(0)
          print('Testando OpenRouter (meta-llama:free)...')
          r = requests.post(
              'https://openrouter.ai/api/v1/chat/completions',
              headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},
              json={'model':'meta-llama/llama-3.3-70b-instruct:free','messages':[{'role':'user','content':'Responda apenas: OK'}],'max_tokens':10},
              timeout=30
          )
          print('HTTP:', r.status_code)
          if r.status_code == 200:
              txt = r.json()['choices'][0]['message']['content']
              print('✅ OpenRouter OK — resposta:', txt.strip())
          elif r.status_code == 429:
              print('⚠️  OpenRouter 429 (rate limit free tier)')
          elif r.status_code == 402:
              print('⚠️  OpenRouter 402 — use apenas modelos :free')
          else:
              print('❌ OpenRouter erro:', r.text[:300])
          "
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Testar acesso às fontes
        run: |
          python3 -c "
          import requests, time, urllib3
          urllib3.disable_warnings()
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          fontes = [
              ('CNMP',             'https://www.cnmp.mp.br/portal/noticias?o=date&t[]='),
              ('PRT-12 (SC)',       'https://www.prt12.mpt.mp.br/informe-se/noticias-do-mpt-sc'),
              ('MTE',              'https://www.gov.br/trabalho-e-emprego/pt-br/noticias-e-conteudo'),
              ('Agência Gov',      'https://agenciagov.ebc.com.br/noticias/trabalho-e-emprego'),
              ('TST — Notícias',   'https://www.tst.jus.br/web/guest/noticias'),
              ('STF — Notícias',   'https://noticias.stf.jus.br/'),
              ('TRT-4 (RS)',        'https://www.trt4.jus.br/portais/trt4/modulos/noticias/todas/0'),
              ('TRT-12 (SC)',       'https://portal.trt12.jus.br/noticias'),
              ('TRT-2 (SP)',        'https://ww2.trt2.jus.br/noticias/noticias'),
              ('Contabeis',        'https://www.contabeis.com.br/conteudo/trabalhista/'),
              ('G1 — Trabalho',    'https://g1.globo.com/trabalho-e-carreira/'),
              ('Senado',           'https://www12.senado.leg.br/noticias/tags/Direitos%20Trabalhistas'),
              ('Câmara — CLT',     'https://www.camara.leg.br/noticias/ultimas/tags?tag=Consolida%C3%A7%C3%A3o%20das%20Leis%20do%20Trabalho%20(CLT)'),
          ]
          ok = 0
          for nome, url in fontes:
              try:
                  r = requests.get(url, headers={'User-Agent': UA}, timeout=15, verify=False)
                  chars = len(r.text)
                  icone = '✅' if r.ok and chars > 1000 else '⚠️ ' if r.ok else '❌'
                  print(f'{icone} {nome}: HTTP {r.status_code} | {chars} chars')
                  if r.ok and chars > 1000:
                      ok += 1
              except Exception as e:
                  print(f'❌ {nome}: ERRO — {e}')
              time.sleep(1)
          print(f'')
          print(f'Fontes acessíveis: {ok}/{len(fontes)}')
          "
